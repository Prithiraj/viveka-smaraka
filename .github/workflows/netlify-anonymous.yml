name: Netlify Anonymous Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy anonymously to Netlify
        run: |
          set -o pipefail
          npx --yes netlify-cli@latest deploy \
            --allow-anonymous \
            --prod \
            --context production 2>&1 | tee netlify-deploy.log
          echo "### Netlify anonymous deploy" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat netlify-deploy.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy metadata
        uses: actions/upload-artifact@v4
        with:
          name: netlify-anonymous-deploy
          path: netlify-deploy.log
          retention-days: 1
